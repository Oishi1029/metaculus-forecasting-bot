name: Keep scheduled workflows alive

# GitHub disables scheduled workflows in a public repo after 60 days with no
# repository activity, silently. An unattended bot would just stop scoring.
# This weekly commit prevents that. It is one of the cheapest failure modes to
# eliminate and one of the hardest to notice.
#
# THURSDAY, deliberately. MiniBench rounds open on Mondays, and a commit landing
# while a scored round is open would have to be defended against the rule that a
# bot maker may not preview a tournament forecast and then modify the bot. Even
# an automated no-op commit is an avoidable thing to have to explain.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 4"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat file
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          git diff --staged --quiet || git commit -m "chore: heartbeat (automated no-op; keeps GitHub from disabling the schedule after 60 days of repo inactivity -- no bot logic is touched)"
          git push
